services:
  agentfarm:
    build: .
    image: agentfarm:local
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - farm-data:/data
    environment:
      AGENTFARM_BIND: 0.0.0.0
      AGENTFARM_DB: /data/agentfarm.db
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.5
    restart: unless-stopped
volumes:
  farm-data:
