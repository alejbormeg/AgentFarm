# Review commands before approving a proposal. No command runs on profile load.
version: 1
repository: alejbormeg/AgentFarm
setup: ./mvnw -B -ntp -q verify -DskipTests && ./mvnw -B -ntp -q test -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false
tests:
  unit: ./mvnw -B -ntp test
  integration: ./mvnw -B -ntp verify && bash runtime/verify.sh
allowed_paths:
  - src/
  - runtime/
  - docs/
  - examples/
  - pom.xml
  - .github/workflows/
environment: container
# Tests run in a disposable container with an exported copy of the commit (no .git,
# no host credentials). Setup has network; tests run offline unless network: always.
container:
  image: maven:3.9.11-eclipse-temurin-21
  network: setup
  cpus: 2
  memory_mb: 4096
  timeout_minutes: 20
review: human-and-independent
# Extra gates (see docs/COMMANDMENTS.md). checks must exit 0; a metric prints a number that may
# not get worse than on the base commit. Higher is better unless it says "better: lower".
# quality:
#   checks:
#     lint: ./mvnw -B -ntp -q spotless:check
#     audit: ./mvnw -B -ntp -q org.owasp:dependency-check-maven:check
#   metrics:
#     coverage: ./mvnw -B -ntp -q verify && python3 tools/coverage.py
#     warnings: {command: ./mvnw -B -ntp -q compile | grep -c WARNING, better: lower}
secret_refs: {}
