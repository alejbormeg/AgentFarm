spring.application.name=AgentFarm
server.address=${AGENTFARM_BIND:127.0.0.1}
server.port=${PORT:8080}
# Lax, not Strict: GitHub sends the owner back to /github-app/* from github.com, and a Strict
# cookie would not travel on that navigation (login again, and GitHub's one-time code lost).
# Lax only adds top-level GET navigations from other sites; every change still needs POST and CSRF.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
agentfarm.db=${AGENTFARM_DB:./data/agentfarm.db}
agentfarm.demo=${AGENTFARM_DEMO:false}

agentfarm.github-token-file=${AGENTFARM_GITHUB_TOKEN_FILE:}
agentfarm.max-parallel=${AGENTFARM_MAX_PARALLEL:2}
agentfarm.max-per-repository=${AGENTFARM_MAX_PER_REPOSITORY:1}
agentfarm.ci-wait-seconds=${AGENTFARM_CI_WAIT_SECONDS:600}

# Leave native-thread headroom inside Compose's 128 PID limit, including healthchecks.
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=64

agentfarm.notify-url=${AGENTFARM_NOTIFY_URL:}
agentfarm.notify-format=${AGENTFARM_NOTIFY_FORMAT:json}
agentfarm.panel-url=${AGENTFARM_PANEL_URL:http://localhost:8080}
agentfarm.users-file=${AGENTFARM_USERS_FILE:}
agentfarm.executor-package=${AGENTFARM_EXECUTOR_PACKAGE:}
agentfarm.github-app-id=${AGENTFARM_GITHUB_APP_ID:}
agentfarm.github-app-key-file=${AGENTFARM_GITHUB_APP_KEY_FILE:}
agentfarm.github-installation-id=${AGENTFARM_GITHUB_INSTALLATION_ID:}
agentfarm.sentry-token-file=${AGENTFARM_SENTRY_TOKEN_FILE:}
agentfarm.sentry-url=${AGENTFARM_SENTRY_URL:https://sentry.io}
