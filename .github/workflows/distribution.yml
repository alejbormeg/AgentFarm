name: Distribution candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash runtime/mvn-retry.sh -B -ntp verify
        env:
          MVN: ./mvnw
      - run: bash runtime/verify.sh
      - run: bash runtime/package.sh
      - run: ./mvnw -B -ntp dependency:list -DoutputFile=target/dependencies.txt
      - run: |
          cd target
          sha256sum agentfarm.jar agentfarm-executor-linux.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentfarm-distribution-candidate
          retention-days: 7
          path: |
            target/agentfarm.jar
            target/agentfarm-executor-linux.tar.gz
            target/SHA256SUMS
            target/dependencies.txt
            LICENSE
            NOTICE
