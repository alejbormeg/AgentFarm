name: Java verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw -B -ntp verify
      - run: bash runtime/verify.sh
      - run: bash runtime/package.sh
        if: matrix.java == '21'
      - uses: actions/upload-artifact@v4
        if: matrix.java == '21'
        with:
          name: agentfarm-jar
          path: |
            target/agentfarm.jar
            target/agentfarm-executor-linux.tar.gz
            LICENSE
            NOTICE
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose up --build --wait -d
      - run: curl --fail http://localhost:8080/login
      - if: always()
        run: docker compose down
