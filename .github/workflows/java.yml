name: Java verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw -B -ntp verify
      - run: java -jar target/agentfarm.jar memory --file examples/project-memory.json --repository owner/example
      - run: java -jar target/agentfarm.jar memory --file agentfarm-memory.json --repository alejbormeg/AgentFarm
      - run: bash runtime/verify.sh
      - run: bash runtime/package.sh
        if: matrix.java == '21'
      - uses: actions/upload-artifact@v4
        if: matrix.java == '21'
        with:
          name: agentfarm-jar
          path: |
            target/agentfarm.jar
            target/agentfarm-executor-linux.tar.gz
            LICENSE
            NOTICE
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp -DskipTests package
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: docker pull -q bash:5.2
      - name: Task end to end with Codex and GitHub doubles, tests in the container sandbox
        run: bash tests/e2e/run.sh
        env:
          E2E_CHROME: google-chrome
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose up --build --wait -d
      - run: curl --fail http://localhost:8080/login
      - run: python3 tests/container_http.py
      - name: Backup and restore through ./agentfarm against Compose
        run: bash tests/compose_backup.sh
      - if: always()
        run: docker compose down
