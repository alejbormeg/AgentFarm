name: Java verification
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'site/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', 'site/**', '*.md']
permissions:
  contents: read
# A newer push to a PR replaces its run: the old one could only send a stale failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Java 25 only after merging: each PR run costs minutes, and Java 21 is what the project compiles for.
        java: ${{ github.event_name == 'push' && fromJSON('["21", "25"]') || fromJSON('["21"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: bash runtime/mvn-retry.sh -B -ntp verify
        env:
          MVN: ./mvnw
      - run: bash tests/credentials.sh
      - run: bash tests/ops.sh
      - run: bash tests/merge_gate.sh
      - run: bash tests/pre_push.sh
      - run: python3 -I tests/pilot/test_run.py
      - run: java -jar target/agentfarm.jar memory --file examples/project-memory.json --repository owner/example
      - run: java -jar target/agentfarm.jar memory --file agentfarm-memory.json --repository alejbormeg/AgentFarm
      - run: bash runtime/verify.sh
      - run: bash runtime/package.sh
        if: matrix.java == '21'
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash runtime/mvn-retry.sh -B -ntp -DskipTests package
        env:
          MVN: ./mvnw
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: docker pull -q bash:5.2
      - name: Task end to end with Codex and GitHub doubles, tests in the container sandbox
        run: bash tests/e2e/run.sh
        env:
          E2E_CHROME: google-chrome
      - name: The demo reaches its promised state
        run: bash runtime/demo.sh
        env:
          AGENTFARM_DEMO_ONCE: '1'
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose up --build --wait -d
      - run: curl --fail http://localhost:8080/login
      - run: python3 tests/container_http.py
      - run: bash tests/dedicated_user.sh
      - name: Backup and restore through ./agentfarm against Compose
        run: bash tests/compose_backup.sh
      - if: always()
        run: docker compose down
